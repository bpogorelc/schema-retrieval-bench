# DRAFT relevance labels for human review.
# Grades: 0=irrelevant, 1=related, 2=relevant, 3=exact/perfect.
# Split rule: all questions in an intent_family share the same split.

label_status: draft
relevance_scale: "0-3"
notes: >
  Labels are draft. Near-miss pairs (gross vs net, order_date vs payment_date,
  churn vs cancellation) are intentional. Review before trusting held-out scores.

