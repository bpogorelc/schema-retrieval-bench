[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-bench"
version = "0.1.0"
description = "Schema Retrieval Benchmark for an Analytics Copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sentence-transformers>=3.0.0",
  "torch>=2.1.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "ray>=2.9.0",
  "chdb>=2.0.0",
  "pyyaml>=6.0",
  "pytest>=7.4.0",
]

[project.scripts]
schema-bench = "schema_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: tests that load models or start Ray",
]
